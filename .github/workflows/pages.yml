name: Deploy 1560 timetable
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Rev210 site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude 'downloads/1560*route-video*.apk' --exclude '.git' --exclude '_site' ./ _site/
          python3 tools/build_rev210.py _site
      - name: Refresh GBIS routes and vehicle positions
        run: python3 tools/fetch_route_video.py _site/route-video-data
      - name: Refresh public KMA observations
        run: python3 tools/fetch_kma_weather.py _site/weather/kma.json
      - name: Include weather in the opening page
        run: python3 tools/embed_kma_weather.py _site
      - name: Verify Korean dates and legacy redirects
        shell: bash
        run: |
          for timetable_tz in Asia/Seoul UTC America/Los_Angeles; do
            TZ="$timetable_tz" node tools/test_rev141.mjs _site 210
          done
          node tools/test_rev156.mjs _site
          node tools/test_rev160.mjs _site
          node tools/test_rev161.mjs _site
          node tools/test_rev162.mjs _site
          node tools/test_rev168.mjs _site
          node tools/test_rev169.mjs _site
          node tools/test_rev173_weather.mjs _site
          node tools/test_rev173_cctv.mjs _site
          node tools/test_rev174.mjs _site
          node tools/test_rev175.mjs _site
          node tools/test_rev177.mjs _site
          node tools/test_rev182.mjs _site
          node tools/test_rev183.mjs _site
          node tools/test_rev184.mjs _site
          node tools/test_rev185.mjs _site
          node tools/test_rev186.mjs _site
          node tools/test_rev188.mjs _site
          node tools/test_rev189.mjs _site
          node tools/test_rev207.mjs _site
          python3 tools/test_kma_weather.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Wait until the uploaded Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for delay in 2 4 8 16 30; do
            sleep "$delay"
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.total_count') || continue
            if [ "$count" = 1 ]; then exit 0; fi
          done
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Mark Pages deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          state="failure"
          desc="GitHub Pages deploy failed"
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            state="success"
            desc="GitHub Pages deploy succeeded"
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"pages-deploy\",\"description\":\"$desc\"}"
