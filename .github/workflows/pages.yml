name: Deploy 1560 timetable
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Rev176 site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' ./ _site/
          python3 tools/build_rev176.py _site
      - name: Refresh public KMA observations
        run: python3 tools/fetch_kma_weather.py _site/weather/kma.json
      - name: Include weather in the opening page
        run: python3 tools/embed_kma_weather.py _site
      - name: Verify Korean dates and legacy redirects
        shell: bash
        run: |
          for timetable_tz in Asia/Seoul UTC America/Los_Angeles; do
            TZ="$timetable_tz" node tools/test_rev141.mjs _site 176
          done
          node tools/test_rev156.mjs _site
          node tools/test_rev160.mjs _site
          node tools/test_rev161.mjs _site
          node tools/test_rev162.mjs _site
          node tools/test_rev168.mjs _site
          node tools/test_rev169.mjs _site
          node tools/test_rev173_weather.mjs _site
          node tools/test_rev173_cctv.mjs _site
          node tools/test_rev174.mjs _site
          node tools/test_rev175.mjs _site
          python3 tools/test_kma_weather.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark Pages deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          state="failure"
          desc="GitHub Pages deploy failed"
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            state="success"
            desc="GitHub Pages deploy succeeded"
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"pages-deploy\",\"description\":\"$desc\"}"
