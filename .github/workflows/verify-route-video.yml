name: Verify 1560 route recorder installation
on:
  push:
    branches: [main]
    paths:
      - 'android-route-video/**'
      - 'downloads/1560-route-video*.apk'
      - '.github/workflows/verify-route-video.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start an Android 17 emulator
        shell: bash
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-37.0;default;x86_64'
          sudo chmod a+rw /dev/kvm
          "$sdk/sdkmanager" "platform-tools" "emulator" "$image"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/route-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$sdk/avdmanager" create avd --force --name route-video --package "$image" \
            --path "$ANDROID_AVD_HOME/route-video.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx 'route-video'
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd route-video -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader > "$RUNNER_TEMP/route-emulator.log" 2>&1 &
          timeout 240 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do
              kill -0 "$1" || exit 1
              sleep 2
            done
          ' -- "$!" || { tail -100 "$RUNNER_TEMP/route-emulator.log"; exit 1; }
          adb shell input keyevent 82
      - name: Install the archived APK and open both routes
        shell: bash
        run: |
          apk=downloads/1560-route-video-1.2.apk
          app=kr.palcheonjo.routevideo1560.capture
          adb install "$apk"
          adb shell pm path "$app"
          adb shell am start -W -n "$app/kr.palcheonjo.routevideo1560.RouteVideoActivity" | grep 'Status: ok'
          for route in A B; do
            adb shell am start -S -W -a android.intent.action.VIEW -c android.intent.category.BROWSABLE \
              -d "routevideo1560capture://record/$route" "$app" | grep 'Status: ok'
          done
          adb shell pidof "$app"
