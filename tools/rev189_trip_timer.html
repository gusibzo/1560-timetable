<section id="tripTimer" data-state="idle" aria-label="출발·도착 운행 타이머">
  <div class="trip-heading"><span>운행 타이머</span><span id="tripStatus" role="status">출발 대기</span></div>
  <div class="trip-controls">
    <button id="tripDepart" type="button">출발</button>
    <output id="tripElapsed" role="timer" aria-label="운행 경과 시간" aria-live="off">00:00:00</output>
    <button id="tripArrive" type="button" disabled>도착</button>
  </div>
  <div class="trip-times"><span>출발 <time id="tripDepartTime">--:--:--</time></span><span>도착 <time id="tripArriveTime">--:--:--</time></span></div>
  <div class="trip-audio">
    <button id="tripSoundCheck" type="button">출발·도착 음성 확인</button>
    <p id="tripSoundStatus" role="status" hidden></p>
  </div>
  <div id="tripLocation" class="trip-location" hidden>
    <span id="tripLocationStatus" role="status"></span>
    <button id="tripGpsRetry" type="button" hidden>GPS 다시 연결</button>
  </div>
  <p id="tripStorageNote" role="status" hidden>저장할 수 없어 이 화면에서만 유지됩니다.</p>
</section>
<script id="trip-records-core">
const TripTimerRecords = (() => {
  const key = 'bus1560-trip-timer-v1';
  const validTime = value => Number.isSafeInteger(value) && value > 0 && value <= 8640000000000000 - 32400000;
  const completed = record => record && validTime(record.startedAt) &&
    validTime(record.arrivedAt) && record.arrivedAt >= record.startedAt;

  function history(trip) {
    if (!trip) return [];
    const records = Array.isArray(trip.history) ? trip.history : [];
    const unique = new Map();
    for (const record of [...records, trip]) {
      if (!completed(record)) continue;
      const {startedAt, arrivedAt} = record;
      unique.set(`${startedAt}/${arrivedAt}`, {startedAt, arrivedAt});
    }
    return Array.from(unique.values()).sort((a, b) => b.arrivedAt - a.arrivedAt || b.startedAt - a.startedAt);
  }

  function read(storage) {
    const raw = storage.getItem(key);
    if (!raw) return null;
    let trip;
    try { trip = JSON.parse(raw); } catch (_) { return null; }
    if (!trip || trip.version !== 1 || !validTime(trip.startedAt)) return null;
    if (trip.arrivedAt !== null && !completed(trip)) return null;
    const saved = {version:1, startedAt:trip.startedAt, arrivedAt:trip.arrivedAt, history:history(trip)};
    if (trip.arrivedAt === null && trip.autoArrival === true) {
      saved.autoArrival = true;
      if (trip.scheduled === true) saved.scheduled = true;
      else if (trip.leftArea === true) saved.leftArea = true;
    }
    if (trip.arrivedAt !== null && typeof trip.arrivalPlace === 'string') saved.arrivalPlace = trip.arrivalPlace;
    if (trip.arrivedAt !== null && trip.gateAnnouncementPending === true) saved.gateAnnouncementPending = true;
    return saved;
  }

  function duration(milliseconds) {
    const seconds = Math.floor(Math.max(0, milliseconds) / 1000);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(Math.floor(seconds/3600))}:${pad(Math.floor(seconds/60)%60)}:${pad(seconds%60)}`;
  }

  return {key, history, read, duration};
})();
</script>
<script id="rev189-trip-timer">
(() => {
  'use strict';
  const {key, duration, history} = TripTimerRecords;
  const panel = document.getElementById('tripTimer');
  const depart = document.getElementById('tripDepart');
  const arrive = document.getElementById('tripArrive');
  const elapsed = document.getElementById('tripElapsed');
  const status = document.getElementById('tripStatus');
  const departTime = document.getElementById('tripDepartTime');
  const arriveTime = document.getElementById('tripArriveTime');
  const soundCheck = document.getElementById('tripSoundCheck');
  const soundStatus = document.getElementById('tripSoundStatus');
  const storageNote = document.getElementById('tripStorageNote');
  const locationBar = document.getElementById('tripLocation');
  const locationStatus = document.getElementById('tripLocationStatus');
  const retry = document.getElementById('tripGpsRetry');

  // Campus entrance at Deogyeong-daero and Cheongmyeong-ro (OSM node 522283295).
  // The main gate is the center of the Neo-Renaissance Gate (OSM way 473963422).
  const intersection = '경희대 사거리';
  const mainGate = '경희대 정문';
  const destinations = [
    {name:intersection, latitude:37.2476648, longitude:127.0791747},
    {name:mainGate, latitude:37.247333, longitude:127.078440},
    // The 1560 arrival stop, number 29038, is west of the gate structure.
    {name:mainGate, latitude:37.2474500, longitude:127.0778667}
  ];
  const arrivalRadius = 120;
  const departureRadius = 220;
  const maxAccuracy = 100;
  const gateAnnouncementWindow = 5 * 60 * 1000;
  const pad = n => String(n).padStart(2, '0');
  let trip = null;
  let persistent = true;
  let watch = null;
  let generation = 0;
  let gpsState = 'waiting';
  let lastFix = 0;
  let nextProbeAt = 0;
  let wakeLock = null;
  let wakeRequested = false;
  let shownDeparture = null;
  let shownDay = null;
  let shownTime = null;
  let message = '';
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const arrivalNotes = [[1318.51, 0.32], [1046.50, 0.32], [783.99, 0.56]];
  const voiceFiles = {
    departure: './audio/trip/departure-ko.mp3',
    gate: './audio/trip/kyung-hee-gate-ko.mp3'
  };
  const chimeWindow = 60000;
  let chimeAudio = null;
  let pendingChime = null;
  let voices = null;
  let loadingVoices = false;
  let playbackGain = null;
  let playbackEnd = 0;

  function showSoundStatus(text) {
    if (soundStatus.textContent !== text) soundStatus.textContent = text;
    soundStatus.hidden = !text;
  }

  function playNotes(notes, start, destination) {
    for (const [index, [frequency, duration]] of notes.entries()) {
      const at = start + index * 0.27;
      const oscillator = chimeAudio.createOscillator();
      const gain = chimeAudio.createGain();
      oscillator.type = 'triangle';
      oscillator.frequency.setValueAtTime(frequency, at);
      gain.gain.setValueAtTime(0.001, at);
      gain.gain.exponentialRampToValueAtTime(0.4, at + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, at + duration);
      oscillator.connect(gain);
      gain.connect(destination);
      oscillator.start(at);
      oscillator.stop(at + duration);
    }
  }

  function loadVoices() {
    if (voices || loadingVoices) return;
    loadingVoices = true;
    Promise.all(Object.entries(voiceFiles).map(async ([kind, path]) => {
      const response = await fetch(path);
      if (!response.ok) throw new Error('Could not load trip announcement');
      return [kind, await chimeAudio.decodeAudioData(await response.arrayBuffer())];
    })).then(entries => {
      voices = Object.fromEntries(entries);
    }, () => {}).finally(() => {
      loadingVoices = false;
      flushChime();
    });
  }

  function playVoice(kind, start, destination) {
    const source = chimeAudio.createBufferSource();
    source.buffer = voices[kind];
    source.connect(destination);
    source.start(start);
    return start + source.buffer.duration;
  }

  function flushChime() {
    if (!pendingChime) return;
    const {kind, at} = pendingChime;
    if (Date.now() - at > chimeWindow) {
      pendingChime = null;
      showSoundStatus('운행음이 재생되지 않았어요 · 소리 확인을 눌러 주세요');
      return;
    }
    if (document.hidden || chimeAudio?.state !== 'running') {
      showSoundStatus(AudioContext ? '운행음 대기 중 · 소리 확인을 눌러 주세요' : '이 브라우저에서 운행음을 재생할 수 없어요');
      return;
    }
    if (kind !== 'arrival' && !voices) {
      showSoundStatus(loadingVoices ? '안내 음성을 불러오는 중이에요' : '안내 음성을 불러오지 못했어요 · 다시 눌러 주세요');
      return;
    }

    pendingChime = null;
    const start = chimeAudio.currentTime + 0.04;
    try {
      playbackGain?.disconnect();
      playbackGain = chimeAudio.createGain();
      playbackGain.connect(chimeAudio.destination);
      if (kind === 'arrival') {
        for (let repeat = 0; repeat < 3; repeat++) playNotes(arrivalNotes, start + repeat * 1.45, playbackGain);
        playbackEnd = start + 4;
      } else if (kind === 'preview') {
        const arrivalAt = playVoice('departure', start, playbackGain) + 0.4;
        playbackEnd = playVoice('gate', arrivalAt, playbackGain);
      } else {
        playbackEnd = playVoice(kind, start, playbackGain);
      }
      showSoundStatus('');
    } catch (_) {
      showSoundStatus('운행음을 재생하지 못했어요 · 다시 눌러 주세요');
    }
  }

  function queueChime(kind, at = Date.now()) {
    if (Date.now() - at > chimeWindow) return;
    pendingChime = {kind, at};
    flushChime();
  }

  function enableChimeAudio() {
    if (!AudioContext) return;
    try {
      if (!chimeAudio) {
        chimeAudio = new AudioContext();
        chimeAudio.addEventListener?.('statechange', flushChime);
      }
      loadVoices();
      if (chimeAudio.state !== 'running') {
        chimeAudio.resume().then(flushChime, () => {});
        // Start a silent oscillator in the same tap to unlock browsers that require it.
        const oscillator = chimeAudio.createOscillator();
        const mute = chimeAudio.createGain();
        mute.gain.value = 0;
        oscillator.connect(mute);
        mute.connect(chimeAudio.destination);
        oscillator.start();
        oscillator.stop(chimeAudio.currentTime + 0.02);
      }
      flushChime();
    } catch (_) {
      showSoundStatus('운행음을 재생하지 못했어요 · 다시 눌러 주세요');
    }
  }

  function read() {
    try {
      return TripTimerRecords.read(localStorage);
    } catch (_) {
      persistent = false;
      return trip;
    }
  }

  function save() {
    try { localStorage.setItem(key, JSON.stringify(trip)); }
    catch (_) { persistent = false; }
  }

  function koreanDate(at) { return new Date(at + 32400000); }
  function stamp(at) {
    const d = koreanDate(at);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate());
  }

  function showTime(node, at, now) {
    if (at === null) {
      node.textContent = '--:--:--';
      node.removeAttribute('datetime');
      node.removeAttribute('title');
      return;
    }
    const d = koreanDate(at);
    const clock = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
    node.textContent = (stamp(at) === stamp(now) ? '' : (d.getUTCMonth()+1) + '/' + d.getUTCDate() + ' ') + clock;
    node.setAttribute('datetime', new Date(at).toISOString());
    node.title = stamp(at) + ' ' + clock + ' (한국 시간)';
  }

  function timetableDay(date) {
    const weekday = date.getDay();
    if (weekday === 0 || calendarInfo(date).holidays.length) return 'sunday';
    return weekday === 6 ? 'saturday' : 'weekday';
  }

  function departureDate(time, now) {
    const [hour, minute] = time.split(':').map(Number);
    const date = new TimetableDate(now);
    date.setHours(hour, minute, 0, 0);
    return date;
  }

  function nextDeparture(date, day, now) {
    for (let i = 0; i < 14; i++, date.setDate(date.getDate() + 1)) {
      if (date.getTime() > now && timetableDay(date) === day) return date.getTime();
    }
    return null;
  }

  function isRunning() {
    return trip !== null && trip.arrivedAt === null && !trip.scheduled;
  }

  function waitingForGate(now) {
    return trip?.gateAnnouncementPending === true && now >= trip.arrivedAt
      && now - trip.arrivedAt <= gateAnnouncementWindow;
  }

  function advance(now) {
    if (!trip?.scheduled || trip.startedAt > now) return;
    if (persistent) trip = read();
    if (trip?.scheduled && trip.startedAt <= now) {
      delete trip.scheduled;
      save();
      queueChime('departure', trip.startedAt);
    }
  }

  function render(now = Date.now()) {
    const scheduled = Boolean(trip?.scheduled);
    const running = isRunning();
    const remaining = scheduled
      ? Math.ceil(Math.max(0, trip.startedAt - now) / 1000) * 1000
      : trip ? (running ? now : trip.arrivedAt) - trip.startedAt : 0;
    elapsed.textContent = duration(remaining);
    elapsed.setAttribute('aria-label', scheduled ? '예약 출발까지 남은 시간' : '운행 경과 시간');
    panel.dataset.state = scheduled ? 'scheduled' : running ? 'running' : trip ? 'arrived' : 'idle';
    const label = scheduled ? '출발 예약' : running ? '운행 중' : trip ? '운행 완료' : '출발 대기';
    if (status.textContent !== label) status.textContent = label;
    depart.disabled = running;
    depart.textContent = scheduled ? '예약 취소' : trip && !running ? '새 출발' : '출발';
    arrive.disabled = !running;
    showTime(departTime, trip?.startedAt ?? null, now);
    showTime(arriveTime, trip?.arrivedAt ?? null, now);
    storageNote.hidden = persistent;

    let detail = message || trip?.arrivalPlace || '';
    if (trip?.autoArrival && !message) {
      if (gpsState === 'denied') detail = '위치 권한을 허용해 주세요';
      else if (gpsState === 'unsupported') detail = 'GPS를 사용할 수 없어요 · 도착은 직접 누르세요';
      else if (gpsState === 'weak') detail = 'GPS 정확도가 낮아요 · 휴대폰의 정확한 위치를 켜 주세요';
      else if (gpsState !== 'ready' || now - lastFix > 25000) detail = 'GPS 위치 확인 중';
      else if (scheduled) detail = 'GPS 연결됨 · 경희대 사거리·정문 자동 도착';
      else detail = trip.leftArea ? '경희대 사거리·정문 도착 감지 중' : '출발 구역을 벗어나면 도착 감지를 시작해요';
    }
    if (trip?.arrivalPlace && !message) detail = '자동 도착 · ' + trip.arrivalPlace;
    locationBar.hidden = !detail;
    if (locationStatus.textContent !== detail) locationStatus.textContent = detail;
    retry.hidden = (!trip?.autoArrival && !waitingForGate(now)) || gpsState === 'unsupported' ||
      (gpsState === 'ready' && now - lastFix <= 25000);

    const selected = scheduled || running ? trip.startedAt : null;
    if (selected !== shownDeparture) {
      shownDeparture = selected;
      if (selected !== null) {
        const date = new TimetableDate(selected);
        shownDay = timetableDay(date);
        shownTime = date.getHours() * 60 + date.getMinutes();
      }
      markSlots();
    }
  }

  function markSlots() {
    for (const button of rows.querySelectorAll('[data-trip-time]')) {
      const [hour, minute] = button.dataset.tripTime.split(':').map(Number);
      const minutes = hour * 60 + minute;
      const day = button.dataset.tripDay;
      const active = shownDeparture !== null && day === shownDay && minutes === shownTime;
      button.setAttribute('aria-pressed', String(active));
    }
  }

  function stopWatch() {
    generation++;
    if (watch !== null) navigator.geolocation.clearWatch(watch);
    watch = null;
    lastFix = 0;
    nextProbeAt = 0;
    if (gpsState === 'ready' || gpsState === 'weak') gpsState = 'waiting';
  }

  function finish(at, place = '') {
    const startedAt = trip?.startedAt;
    if (persistent) trip = read();
    if (!isRunning() || trip.startedAt !== startedAt || (place && !trip.leftArea)) return false;
    trip.arrivedAt = Math.max(startedAt, at);
    delete trip.autoArrival;
    delete trip.leftArea;
    if (place) trip.arrivalPlace = place;
    if (place === intersection) trip.gateAnnouncementPending = true;
    trip.history = history(trip);
    message = '';
    save();
    update();
    queueChime(place === mainGate ? 'gate' : 'arrival', trip.arrivedAt);
    return true;
  }

  function announceGate(now, at) {
    const startedAt = trip.startedAt;
    if (persistent) trip = read();
    if (!waitingForGate(now) || trip.startedAt !== startedAt || at <= trip.arrivedAt) return;
    delete trip.gateAnnouncementPending;
    save();
    queueChime('gate', at);
  }

  function onPosition(position) {
    const now = Date.now();
    const {coords, timestamp} = position;
    if (![coords.latitude, coords.longitude, coords.accuracy, timestamp].every(Number.isFinite)
        || coords.accuracy <= 0 || timestamp <= lastFix
        || timestamp < now - 25000 || timestamp > now + 3000) return;
    if (coords.accuracy > maxAccuracy) {
      if (now - lastFix > 25000) {
        gpsState = 'weak';
        render(now);
      }
      return;
    }
    lastFix = timestamp;
    gpsState = 'ready';
    advance(now);
    const trackingTrip = isRunning() && trip.autoArrival && timestamp >= trip.startedAt;
    if (trackingTrip || waitingForGate(now)) {
      const distances = destinations.map(destination => rev92DistanceMetres(coords, destination));
      if (trackingTrip && !trip.leftArea) {
        if (distances.every(distance => distance - coords.accuracy >= departureRadius)) {
          const startedAt = trip.startedAt;
          if (persistent) trip = read();
          if (isRunning() && trip.autoArrival && trip.startedAt === startedAt && !trip.leftArea) {
            trip.leftArea = true;
            save();
          }
        }
      } else {
        // The gate and intersection have overlapping arrival areas.
        const closest = Math.min(...distances);
        const accuracyMargin = Math.min(25, coords.accuracy / 3);
        if (closest + accuracyMargin <= arrivalRadius) {
          const place = destinations[distances.indexOf(closest)].name;
          const at = Math.min(timestamp, now);
          if (trackingTrip) finish(at, place);
          else if (place === mainGate) announceGate(now, at);
        }
      }
    }
    update();
  }

  const watchOptions = {enableHighAccuracy:true, maximumAge:0, timeout:15000};

  function syncWatch(now) {
    const gatePending = waitingForGate(now);
    if ((!trip?.autoArrival && !gatePending) || document.hidden) {
      if (watch !== null) stopWatch();
      return;
    }
    if (gpsState === 'denied' || gpsState === 'unsupported') return;
    if (watch !== null) {
      // Some browsers stop emitting watch callbacks while the phone stays in one place.
      if ((isRunning() || gatePending) && now >= nextProbeAt && now - lastFix >= 15000
          && typeof navigator.geolocation.getCurrentPosition === 'function') {
        nextProbeAt = now + 20000;
        const token = generation;
        navigator.geolocation.getCurrentPosition(
          position => { if (token === generation) onPosition(position); },
          error => { if (token === generation && error.code === 1) onGpsError(error); },
          watchOptions
        );
      }
      return;
    }
    if (!globalThis.navigator?.geolocation) {
      gpsState = 'unsupported';
      return;
    }
    const token = ++generation;
    nextProbeAt = now + 15000;
    try {
      watch = navigator.geolocation.watchPosition(
        position => { if (token === generation) onPosition(position); },
        error => { if (token === generation) onGpsError(error); },
        watchOptions
      );
    } catch (_) {
      gpsState = 'unsupported';
    }
  }

  function onGpsError(error) {
    if (error.code === 1) {
      gpsState = 'denied';
      stopWatch();
    } else if (gpsState !== 'weak' && Date.now() - lastFix > 25000) {
      gpsState = 'waiting';
    }
    syncScreen(Date.now());
    render();
  }

  function syncScreen(now) {
    const nearDeparture = trip?.scheduled && trip.startedAt - now <= 120000;
    const needed = ((trip?.autoArrival && (isRunning() || nearDeparture)) || waitingForGate(now)) && !document.hidden
      && gpsState !== 'denied' && gpsState !== 'unsupported';
    if (!needed) {
      wakeRequested = false;
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
      return;
    }
    if (wakeRequested || !globalThis.navigator?.wakeLock) return;
    wakeRequested = true;
    const startedAt = trip.startedAt;
    navigator.wakeLock.request('screen').then(lock => {
      if (trip?.startedAt !== startedAt || (!trip.autoArrival && !waitingForGate(Date.now())) || document.hidden
          || gpsState === 'denied' || gpsState === 'unsupported') {
        lock.release().catch(() => {});
        return;
      }
      wakeLock = lock;
      lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
    }).catch(() => {});
  }

  function update() {
    const now = Date.now();
    advance(now);
    syncWatch(now);
    syncScreen(now);
    render(now);
    flushChime();
  }

  function selectDeparture(button) {
    if (persistent) trip = read();
    const now = Date.now();
    advance(now);
    const {tripTime, tripDay} = button.dataset;
    const date = departureDate(tripTime, now);
    const selected = date.getTime();
    if (isRunning() && selected <= now && timetableDay(date) === tripDay) {
      // A trip left running from a previous day needs to leave the origin again.
      if (stamp(trip.startedAt) !== stamp(selected)) delete trip.leftArea;
      trip.startedAt = selected;
    } else {
      const startedAt = nextDeparture(date, tripDay, now);
      if (startedAt === null) return;
      trip = {version:1, startedAt, arrivedAt:null, autoArrival:true, scheduled:true, history:history(trip)};
    }
    enableChimeAudio();
    if (gpsState === 'denied') gpsState = 'waiting';
    message = '';
    save();
    update();
  }

  depart.addEventListener('click', () => {
    const wasScheduled = Boolean(trip?.scheduled);
    if (persistent) trip = read();
    advance(Date.now());
    if (isRunning() || (wasScheduled && !trip?.scheduled)) { update(); return; }
    const records = history(trip);
    if (trip?.scheduled) {
      trip = records.length ? {version:1, ...records[0], history:records} : null;
    } else {
      trip = {version:1, startedAt:Date.now(), arrivedAt:null, autoArrival:true, history:records};
      if (gpsState === 'denied') gpsState = 'waiting';
    }
    message = '';
    save();
    update();
    if (isRunning()) {
      enableChimeAudio();
      queueChime('departure', trip.startedAt);
    }
  });
  arrive.addEventListener('click', () => {
    if (finish(Date.now())) enableChimeAudio();
  });
  soundCheck.addEventListener('click', () => {
    flushChime();
    if (pendingChime) {
      enableChimeAudio();
      return;
    }
    if ((chimeAudio?.currentTime ?? 0) < playbackEnd) return;
    enableChimeAudio();
    queueChime('preview');
  });
  retry.addEventListener('click', () => {
    gpsState = 'waiting';
    message = '';
    stopWatch();
    update();
  });

  document.addEventListener('click', event => {
    const button = event.target.closest('#rows button[data-trip-time]');
    if (button) selectDeparture(button);
    // A restored or interrupted trip can unlock audio on the next tap.
    else if ((trip?.autoArrival || waitingForGate(Date.now()) || pendingChime) && chimeAudio?.state !== 'running'
        && ![depart, arrive, soundCheck].includes(event.target)) enableChimeAudio();
  });
  // Refresh new buttons after the timetable is rebuilt or a different day is selected.
  const rows = document.getElementById('rows');
  if (typeof MutationObserver === 'function') {
    new MutationObserver(() => {
      if (shownDeparture !== null) markSlots();
    }).observe(rows, {childList:true});
  }

  function restore() {
    if (persistent) trip = read();
    if (isRunning() && !trip.autoArrival) {
      // A trip already started with the old manual button can still detect arrival.
      trip.autoArrival = true;
      save();
    }
    message = '';
    update();
  }
  window.addEventListener('pageshow', restore);
  window.addEventListener('pagehide', () => {
    stopWatch();
    wakeRequested = false;
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  });
  window.addEventListener('storage', event => {
    if (event.key === key || event.key === null) restore();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) update(); else restore(); });
  setInterval(() => { if (!document.hidden) update(); }, 1000);
  restore();
})();
</script>
