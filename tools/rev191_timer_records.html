<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>타이머 기록 · 1560 버스 자료실</title>
  <link rel="icon" href="./icons/icon-192.png">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font-family: system-ui, "Noto Sans KR", sans-serif; }
    body { margin: 0; background: #080808; color: #f2f4f7; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #ffdf59; outline-offset: 3px; }
    .header { background: #111; border-bottom: 4px solid #ffdf59; }
    .header-inner, main { max-width: 700px; margin: auto; padding: 22px 16px; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: clamp(22px, 5.4vw, 30px); }
    h1 b { color: #ffdf59; }
    .back, .timetable { display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: 9px 12px; border-radius: 10px; font-weight: 750; white-space: nowrap; }
    .back { border: 1px solid #6d8aa5; background: #252525; }
    .timetable { background: #ffdf59; color: #172b3d; }
    .tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .count { color: #bbc4cd; font-size: 15px; }
    .records { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .record, .message { background: #161616; border: 1px solid #697787; border-radius: 14px; padding: 15px; }
    .record-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
    .record-head strong { font-size: 24px; color: #ffdf59; font-variant-numeric: tabular-nums; }
    .record-head span { color: #bbc4cd; font-size: 14px; }
    dl { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 10px 0 0; }
    dt { font-size: 13px; color: #bbc4cd; }
    dd { margin: 3px 0 0; font-size: clamp(15px, 4.2vw, 18px); font-weight: 750; font-variant-numeric: tabular-nums; }
    .message { margin: 0; line-height: 1.65; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1><b>1560</b> 타이머 기록</h1>
      <a class="back" href="https://bus1560-board.gusibzo.chatgpt.site/">‹ 자료실</a>
    </div>
  </header>
  <main>
    <div class="tools"><span id="recordCount" class="count" role="status"></span><a class="timetable" href="./">시간표 열기</a></div>
    <p id="recordMessage" class="message" hidden></p>
    <ul id="tripRecords" class="records" aria-label="완료한 운행 기록"></ul>
    <template id="tripRecordTemplate">
      <li class="record">
        <div class="record-head"><strong data-duration></strong><span data-date></span></div>
        <dl>
          <div><dt>출발</dt><dd><time data-departure></time></dd></div>
          <div><dt>도착</dt><dd><time data-arrival></time></dd></div>
        </dl>
      </li>
    </template>
  </main>
  <!-- TRIP_RECORDS_CORE -->
  <script id="trip-records-page">
    (() => {
      const count = document.getElementById('recordCount');
      const message = document.getElementById('recordMessage');
      const list = document.getElementById('tripRecords');
      const template = document.getElementById('tripRecordTemplate');
      const date = new Intl.DateTimeFormat('ko-KR', {
        timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'
      });
      const clock = new Intl.DateTimeFormat('ko-KR', {
        timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
      });

      function showTime(node, timestamp, includeDate = false) {
        const at = new Date(timestamp);
        node.dateTime = at.toISOString();
        node.textContent = (includeDate ? date.format(at) + ' ' : '') + clock.format(at);
      }

      function render() {
        let records;
        try {
          records = TripTimerRecords.read(localStorage)?.history ?? [];
        } catch (_) {
          count.textContent = '';
          list.replaceChildren();
          message.textContent = '이 브라우저에서 저장된 기록을 읽을 수 없습니다.';
          message.hidden = false;
          return;
        }
        count.textContent = `운행 기록 ${records.length.toLocaleString('ko-KR')}건`;
        message.textContent = '시간표에서 출발과 도착을 누르면 운행 기록이 여기에 표시됩니다.';
        message.hidden = records.length > 0;
        const rows = document.createDocumentFragment();
        for (const record of records) {
          const row = template.content.cloneNode(true);
          const started = date.format(record.startedAt);
          const arrived = date.format(record.arrivedAt);
          row.querySelector('[data-duration]').textContent = TripTimerRecords.duration(record.arrivedAt - record.startedAt);
          row.querySelector('[data-date]').textContent = started;
          showTime(row.querySelector('[data-departure]'), record.startedAt);
          showTime(row.querySelector('[data-arrival]'), record.arrivedAt, started !== arrived);
          rows.append(row);
        }
        list.replaceChildren(rows);
      }

      window.addEventListener('pageshow', render);
      window.addEventListener('storage', event => {
        if (event.key === TripTimerRecords.key || event.key === null) render();
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js?v=191', {updateViaCache:'none'}).catch(() => {});
        });
      }
      render();
    })();
  </script>
</body>
</html>
